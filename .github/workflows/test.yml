name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - name: Install poppler (independent PDF renderer used by the PDF tests)
        run: which pdftoppm || (sudo apt-get update -q && sudo apt-get install -y -q poppler-utils)
      - run: npm test
