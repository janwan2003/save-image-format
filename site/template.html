<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="{{csp}}">
<meta name="referrer" content="no-referrer">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
{{robotsMeta}}<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Saveform">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:locale" content="en">
<meta property="og:image" content="https://janwan2003.github.io/save-image-format/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="{{root}}favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{root}}assets/style.css">
{{head}}</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{root}}">{{logo}}<span>Saveform</span></a>
    <nav aria-label="Main">
      <a href="{{root}}"{{navConvert}}>Converter</a>
      <a href="{{root}}extension/"{{navExtension}}>Extension</a>
      <a href="{{root}}privacy/"{{navPrivacy}}>Privacy</a>
    </nav>
  </div>
</header>
<main id="main" class="wrap">
{{main}}
</main>
<footer class="site-footer">
  <div class="wrap">
    <p><strong>About: Saveform</strong> converts images on your own device. No uploads, no accounts, no analytics.</p>
    <p class="footer-links"><a href="{{root}}privacy/">Privacy</a> <a href="{{root}}extension/">Browser extension</a> <a href="{{repo}}">Source on GitHub</a></p>
    <p class="footer-links">Guides: {{footerGuides}}</p>
  </div>
</footer>
{{scripts}}</body>
</html>
